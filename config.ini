[REMI]
# Remi 2.1 uses two secrets, namely: SECRET_KEY and NCBI_API_KEY

# Flask key used to securely sign session cookies. Can be anything, but why not make it good?
# You can generate your own secret key with: python -c "import secrets; print(secrets.token_hex(32))"

SECRET_KEY = [fill in the output of the python command above, e.g., 6d928f68f18224d6fe2b56f359db334938bb1271cfa06df0eae06b4818241f7d]

# Personal NCBI API key used for PubMed requests and higher request limits.
# Generate one by signing in to your NCBI account and opening Account Settings.
# See: https://www.ncbi.nlm.nih.gov/datasets/docs/v2/api/api-keys/ for more information.

NCBI_API_KEY = [fill in your NCBI api key]

# Optional: a contact email address that NCBI can use if there is a problem with REMI's requests.

CONTACT_EMAIL =
